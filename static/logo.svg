<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12261a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"
        stroke="#2ea043" stroke-width="2.5"/>

  <!-- candlesticks (trading), rising left to right -->
  <g stroke="#3fb950" stroke-width="3" stroke-linecap="round">
    <line x1="16" y1="27" x2="16" y2="45"/>
    <line x1="26" y1="21" x2="26" y2="41"/>
    <line x1="36" y1="15" x2="36" y2="35"/>
  </g>
  <g fill="#3fb950">
    <rect x="12" y="32" width="8" height="8" rx="1.5"/>
    <rect x="22" y="26" width="8" height="9" rx="1.5"/>
    <rect x="32" y="19" width="8" height="10" rx="1.5"/>
  </g>

  <!-- growth arrow (investing / future) sweeping over the candles -->
  <path d="M 12 43 C 22 41, 31 33, 42 22"
        fill="none" stroke="url(#rise)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 35 20 L 44 19 L 42.5 28" fill="none" stroke="#56d364"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the future point: gold coin with the मही monogram -->
  <circle cx="48" cy="14" r="9" fill="#d4a017"/>
  <circle cx="48" cy="14" r="9" fill="none" stroke="#f0c94f" stroke-width="1.6"/>
  <text x="48" y="17.6" text-anchor="middle" font-family="sans-serif"
        font-size="8.6" font-weight="700" fill="#5c4000">मही</text>
</svg>
