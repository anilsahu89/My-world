<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12261a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="0.5" stop-color="#56d364"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"
        stroke="#2ea043" stroke-width="2.5"/>

  <!-- infinity mark: green flowing into gold (endless growth) -->
  <path d="M 30 38 C 27 28, 11 28, 11 38 C 11 48, 27 48, 30 38
           C 33 28, 49 28, 49 38 C 49 48, 33 48, 30 38"
        fill="none" stroke="url(#loop)" stroke-width="5"
        stroke-linecap="round"/>

  <!-- candles inside the left loop -->
  <g stroke="#3fb950" stroke-width="2" stroke-linecap="round">
    <line x1="15.5" y1="34.5" x2="15.5" y2="42"/>
  </g>
  <rect x="13.7" y="36" width="3.6" height="4.4" rx="0.7" fill="#3fb950"/>
  <g stroke="#e5534b" stroke-width="2" stroke-linecap="round">
    <line x1="21.5" y1="34" x2="21.5" y2="42.5"/>
  </g>
  <rect x="19.7" y="35.5" width="3.6" height="4.6" rx="0.7" fill="#e5534b"/>

  <!-- rising candles inside the right loop -->
  <g stroke="#3fb950" stroke-width="2" stroke-linecap="round">
    <line x1="38.5" y1="35" x2="38.5" y2="43"/>
    <line x1="43.5" y1="32" x2="43.5" y2="41"/>
  </g>
  <rect x="36.7" y="36.5" width="3.6" height="4.6" rx="0.7" fill="#3fb950"/>
  <rect x="41.7" y="33.5" width="3.6" height="5" rx="0.7" fill="#56d364"/>

  <!-- gold arrow bursting off the right loop -->
  <path d="M 47 29 C 51 24, 54 19, 57 13" fill="none" stroke="#d4a017"
        stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 51.5 11.5 L 58.5 10.5 L 57.5 17.5" fill="none" stroke="#f0c94f"
        stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
