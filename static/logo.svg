<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12261a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"
        stroke="#2ea043" stroke-width="2.5"/>

  <!-- candlesticks (trading), rising left to right -->
  <g stroke="#3fb950" stroke-width="3" stroke-linecap="round">
    <line x1="18" y1="26" x2="18" y2="44"/>
    <line x1="29" y1="20" x2="29" y2="40"/>
    <line x1="40" y1="14" x2="40" y2="34"/>
  </g>
  <g fill="#3fb950">
    <rect x="14" y="31" width="8" height="8" rx="1.5"/>
    <rect x="25" y="25" width="8" height="9" rx="1.5"/>
    <rect x="36" y="18" width="8" height="10" rx="1.5"/>
  </g>

  <!-- growth arrow (investing / future) sweeping over the candles -->
  <path d="M 13 42 C 24 40, 34 32, 46 20"
        fill="none" stroke="url(#rise)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 38 18 L 48 17 L 46 27" fill="none" stroke="#56d364"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the future point: a gold coin -->
  <circle cx="50" cy="14" r="6.5" fill="#d4a017"/>
  <circle cx="50" cy="14" r="6.5" fill="none" stroke="#f0c94f" stroke-width="1.5"/>
  <path d="M 50 10.5 v 7 M 48 12 h 4 M 48 16 h 4" stroke="#7a5c00" stroke-width="1.4"
        stroke-linecap="round" fill="none"/>
</svg>
