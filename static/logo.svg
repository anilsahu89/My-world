<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12261a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"
        stroke="#2ea043" stroke-width="2.5"/>

  <!-- the M, built from bold gold strokes (variant 1's letterform) -->
  <g stroke="#d4a017" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"
     fill="none">
    <path d="M 13 17 L 13 49"/>
    <path d="M 51 17 L 51 49"/>
    <path d="M 13 17 L 32 38 L 51 17"/>
  </g>

  <!-- the growth arrow rising through the M's own valley -->
  <g stroke="#56d364" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"
     fill="none">
    <path d="M 32 38 L 32 13"/>
    <path d="M 24 19 L 32 9 L 40 19"/>
  </g>
</svg>
