<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12261a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"
        stroke="#2ea043" stroke-width="2.5"/>

  <!-- the bold M (owner pick, variant 1) -->
  <text x="29" y="47" text-anchor="middle" font-family="sans-serif"
        font-size="34" font-weight="900" fill="#d4a017">M</text>

  <!-- gold arrow sweeping diagonally through the M (variant 1 signature) -->
  <path d="M 8 50 C 20 44, 34 30, 50 14" fill="none" stroke="#56d364"
        stroke-width="5" stroke-linecap="round"/>
  <path d="M 42 10 L 55 9 L 53.5 22" fill="none" stroke="#56d364"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chunky candles riding the arrow's base (trading) -->
  <g stroke="#3fb950" stroke-width="2.4" stroke-linecap="round">
    <line x1="46" y1="34" x2="46" y2="47"/>
    <line x1="53" y1="30" x2="53" y2="43"/>
  </g>
  <rect x="43.6" y="37" width="4.8" height="7" rx="1" fill="#3fb950"/>
  <rect x="50.6" y="33" width="4.8" height="7" rx="1" fill="#e5534b"/>
</svg>
