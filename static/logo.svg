<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12261a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"
        stroke="#2ea043" stroke-width="2.5"/>

  <!-- green growth arrow BEHIND the M, corner to corner -->
  <path d="M 7 54 C 18 47, 30 33, 47 16" fill="none" stroke="#2ea043"
        stroke-width="4" stroke-linecap="round"/>
  <path d="M 40 12 L 53 11 L 51.5 24" fill="none" stroke="#2ea043"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the M: dominant gold letterform on top -->
  <text x="26" y="45" text-anchor="middle" font-family="sans-serif"
        font-size="37" font-weight="900" fill="#d4a017">M</text>

  <!-- two compact candles tucked bottom-right, clear of the M -->
  <g stroke="#3fb950" stroke-width="2" stroke-linecap="round">
    <line x1="47" y1="41" x2="47" y2="51"/>
  </g>
  <rect x="44.8" y="43" width="4.4" height="5.5" rx="0.8" fill="#3fb950"/>
  <g stroke="#e5534b" stroke-width="2" stroke-linecap="round">
    <line x1="54" y1="43" x2="54" y2="53"/>
  </g>
  <rect x="51.8" y="45" width="4.4" height="5.5" rx="0.8" fill="#e5534b"/>
</svg>
