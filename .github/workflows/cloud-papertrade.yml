name: Cloud Paper Trade

on:
  workflow_dispatch:
    inputs:
      desk:
        description: "Paper-trade desk"
        required: true
        default: all
        type: choice
        options: [all, nse, gc, swing]
  schedule:
    # NSE entry window: 5-minute polls 09:32-09:57 IST (cutoff 09:45).
    - cron: "2,7,12,17 4 * * 1-5"
    # NSE management: 15-minute polls 10:07-14:52 IST (SL / 10:45 time-stop).
    - cron: "7,22,37,52 5-9 * * 1-5"
    # NSE square-off: final closes at 15:37 / 15:52 IST (bars complete).
    - cron: "7,22 10 * * 1-5"
    # Swing desk: scan the day's completed daily bars, 17:35 IST weekdays.
    - cron: "5 12 * * 1-5"
    # Gold/BTC: 15-minute cloud polling; Gold simply has no session on weekends.
    - cron: "11,26,41,56 0-23 * * *"

concurrency:
  group: cloud-papertrade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  papertrade:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install market-data dependencies
        run: pip install yfinance pandas numpy
      - name: Choose scheduled desk
        id: desk
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.desk }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "11,26,41,56 0-23 * * *" ]; then
            echo "value=gc" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 12 * * 1-5" ]; then
            echo "value=swing" >> "$GITHUB_OUTPUT"
          else
            echo "value=nse" >> "$GITHUB_OUTPUT"
          fi
      - name: Update paper ledger and dashboard snapshots
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python3 scanners/cloud_papertrade.py "${{ steps.desk.outputs.value }}"
      - name: Commit changed state
        run: |
          git config user.name "papertrade-bot"
          git config user.email "papertrade-bot@users.noreply.github.com"
          git add -A -- data/cloud_paper_ol_state.json data/cloud_paper_gc_state.json data/cloud_swing_state.json data/paper_ol.json data/paper_gc.json data/swing_picks.json
          git diff --cached --quiet || git commit -m "chore: cloud paper trade $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
