name: Fetch NSE Alerts

on:
  schedule:
    # NSE market hours are 9:15–15:30 IST (03:45–10:00 UTC).
    # This runs every 5 minutes within that window, Mon–Fri.
    - cron: "*/5 3-9 * * 1-5"
    - cron: "45-59/5 3 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install kiteconnect pandas yfinance

      - name: Run scan
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python fetch_and_scan.py

      - name: Commit updated data
        run: |
          git config user.name "alerts-bot"
          git config user.email "actions@github.com"
          git add data/alerts.json data/paper_trades.json || true
          git diff --cached --quiet || git commit -m "Update alerts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
