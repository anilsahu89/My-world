name: Apply win-rate tune
on:
  workflow_dispatch:
  push:
    branches: [fix/winrate-tune]
    paths:
      - 'scanners/_patch_winrate.py'
      - '.github/workflows/apply-winrate-tune.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/winrate-tune
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch cloud_papertrade.py
        run: python3 scanners/_patch_winrate.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scanners/cloud_papertrade.py
          if git diff --staged --quiet; then echo none; else
            git commit -m 'fix(nse): win-rate tune — RVOL, bias, max-loss, F3 quality'
            git push origin fix/winrate-tune
          fi
