name: Strip non-trade Telegram calls
on:
  workflow_dispatch:
  push:
    branches: [fix/telegram-trade-only]
    paths:
      - '.github/workflows/strip-nontrade-tg.yml'

jobs:
  strip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-trade-only
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove feed-warning and EOD-fail Telegram notifies
        run: |
          set -e
          FILE=scanners/cloud_papertrade.py
          python3 << 'PY'
          from pathlib import Path
          p = Path("scanners/cloud_papertrade.py")
          text = p.read_text()
          # 1) Yahoo fallback alert block: keep stamp logic, drop telegram notify
          old1 = '''    try:
        import telegram_notify
        telegram_notify.notify(
            "\\u26A0\\uFE0F Quotes on the DELAYED Yahoo fallback (market hours)\\n"
            + " + ".join(down)
            + " failed this poll \\u2014 auto-retry on the next one; "
              "fills are approximate meanwhile.")
    except Exception:
        pass'''
          new1 = '''    # Telegram: trade-only (15 Oct) — feed warnings stay in Actions log
    print("feed warning: delayed Yahoo fallback during market hours: " + " + ".join(down))
'''
          # Try unicode-escaped and actual forms
          changed = False
          if old1 in text:
              text = text.replace(old1, new1, 1)
              changed = True
          else:
              # looser match via markers
              import re
              pat = re.compile(
                  r"    try:\n"
                  r"        import telegram_notify\n"
                  r"        telegram_notify\.notify\(\n"
                  r".*?Quotes on the DELAYED Yahoo fallback.*?"
                  r"    except Exception:\n"
                  r"        pass",
                  re.S,
              )
              text2, n = pat.subn(new1, text, count=1)
              if n:
                  text = text2
                  changed = True
                  print("replaced yahoo block via regex")
              else:
                  print("yahoo block not found")
          # 2) Candle Swing EOD failure notify
          pat2 = re.compile(
              r"                    try:\n"
              r"                        import telegram_notify\n"
              r"                        telegram_notify\.notify\(\n"
              r".*?Candle Swing EOD scan failed.*?"
              r"                    except Exception:\n"
              r"                        pass",
              re.S,
          )
          text3, n2 = pat2.subn(
              "                    print(f\"swing EOD notify suppressed (trade-only telegram): {e}\")\n",
              text,
              count=1,
          )
          if n2:
              text = text3
              changed = True
              print("replaced swing EOD notify")
          else:
              print("swing EOD block not found")
          if not changed:
              raise SystemExit("no replacements made")
          p.write_text(text)
          print("ok")
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scanners/cloud_papertrade.py
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix(telegram): drop non-trade notify calls (feed warn / swing EOD)'
            git push origin fix/telegram-trade-only
          fi
