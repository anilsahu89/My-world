name: Apply deploy suggestions
on:
  workflow_dispatch:
  push:
    branches: [fix/deploy-suggestions]
    paths:
      - 'scanners/_patch_deploy_suggestions.py'
      - '.github/workflows/apply-deploy-suggestions.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deploy-suggestions
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run patch script
        run: python3 scanners/_patch_deploy_suggestions.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scanners/cloud_papertrade.py
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix(nse): F3 done-date after scan, RVOL 1.0/0.8, persist before TG'
            git push origin fix/deploy-suggestions
          fi
